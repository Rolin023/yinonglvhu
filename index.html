            background-color: #0f1a13;

        .hero-overlay {

        }
        .hero-content {
            position: absolute; top: 45%; left: 60px; transform: translateY(-50%);
            z-index: 2; max-width: 700px; text-align: left; margin: 0;

        .hero-content h1 { font-size: 72px; font-weight: 800; line-height: 1.1; letter-spacing: 1px; color: #fff; }
        .hero-content h1 .highlight { color: #6bd17c; }

        .features {
            position: absolute; bottom: 120px; left: 60px; right: 60px;
            z-index: 2; display: flex; justify-content: flex-start; gap: 40px; flex-wrap: wrap;
        }
        .feature-item { display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 120px; flex: 0 0 auto; }
        .feature-icon { width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.5); background: rgba(255, 255, 255, 0.1); display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 12px; }
        .feature-icon img { width: 40px; height: 40px; object-fit: contain; display: block; }
        .feature-title { font-size: 16px; font-weight: 600; color: #fff; letter-spacing: 0.5px; margin-bottom: 4px; }
        .feature-desc { font-size: 13px; color: #ccc; font-weight: 400; letter-spacing: 0.3px; }
        .scroll-hint { position: absolute; bottom: 0; left: 60px; z-index: 3; display: flex; align-items: center; gap: 10px; font-size: 13px; color: rgba(255, 255, 255, 0.5); letter-spacing: 0.5px; }

        @media (max-width: 1200px) {
            .hero-content { left: 40px; }
            .features { left: 40px; right: 40px; gap: 30px; bottom: 100px; }
            .hero-content h1 { font-size: 56px; }
            .hero-content .subtitle { font-size: 22px; }
        }
        @media (max-width: 992px) {
            .hero-content h1 { font-size: 44px; }
            .hero-content .subtitle { font-size: 18px; }
            .features { gap: 20px; bottom: 80px; }
            .feature-item { min-width: 100px; }
            .feature-icon { width: 56px; height: 56px; }
            .feature-icon img { width: 32px; height: 32px; }
        }
        @media (max-width: 768px) {
            .hero-content { left: 20px; right: 20px; max-width: 100%; top: 40%; }
            .hero-content h1 { font-size: 34px; line-height: 1.2; }
            .hero-content .subtitle { font-size: 17px; margin-top: 10px; }
            .btn-learn { padding: 10px 28px; font-size: 15px; margin-top: 20px; }
            .features { position: relative; bottom: auto; left: auto; right: auto; margin-top: 50px; padding: 0 20px 30px; justify-content: center; gap: 14px; }
            .feature-item { flex: 0 0 calc(50% - 12px); min-width: 70px; padding: 6px 0; }
            .feature-icon { width: 48px; height: 48px; }
            .feature-icon img { width: 28px; height: 28px; }
            .scroll-hint { display: none; }
        }
        @media (max-width: 480px) {
            .hero-content h1 { font-size: 28px; }
            .hero-content .subtitle { font-size: 15px; }
            .feature-item { flex: 0 0 calc(50% - 10px); min-width: 60px; }
            .feature-icon { width: 42px; height: 42px; }
            .feature-icon img { width: 24px; height: 24px; }
            .feature-title { font-size: 13px; }
            .feature-desc { font-size: 11px; }
        }
